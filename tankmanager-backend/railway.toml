[build]
builder = "NIXPACKS"
buildCommand = "cd tankmanager-backend && npm install && npx prisma generate && npm run build"

[deploy]
startCommand = "cd tankmanager-backend && npx prisma migrate deploy && node dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.config]
workdir = "tankmanager-backend"
