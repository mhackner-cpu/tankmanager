# Nixpacks plan for TankManager Backend (Monorepo)

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs", "openssl"]

[phases.install]
cmds = [
  "cd tankmanager-backend",
  "npm ci"
]

[phases.build]
cmds = [
  "cd tankmanager-backend",
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "cd tankmanager-backend && npx prisma migrate deploy && node dist/main"
