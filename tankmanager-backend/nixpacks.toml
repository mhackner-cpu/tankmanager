# Nixpacks Configuration for Railway
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-20_x", "openssl"]

[phases.install]
cmds = [
  "npm ci --omit=dev --ignore-scripts",
  "npm install --save-dev @nestjs/cli typescript @types/node",
  "npx prisma generate"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx prisma migrate deploy && node dist/main"
